<div class="layout-shell">
	<aside class="sidebar" [ngClass]="isSideBarCollapsed?'sidebar--collapsed':''" aria-label="Primary navigation">
		<div class="sidebar-header">
			<a class="sidebar-brand" href="#" aria-label="Hospital prescription home">
				<span class="brand-mark" aria-hidden="true">
					<span></span>
					<span></span>
				</span>
				<span class="brand-name">CarePoint</span>
			</a>
			<button class="sidebar-toggle" (click)="toggleSidebar()" type="button" aria-label="Collapse sidebar">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M15 6 9 12l6 6" />
				</svg>
			</button>
		</div>

		<div class="sidebar-divider"></div>

		<nav class="sidebar-nav">
			@for (item of allowedMenuList; track $index) {
				<a class="sidebar-link" [routerLink]="'/'+item.url" routerLinkActive="active">
					<i class="fa-solid" [ngClass]="item.icon"></i>
					<span>{{item.title}}</span>
				</a>
			}
		</nav>

		<div class="sidebar-footer">
			<div class="profile-card">
				<div class="profile-avatar">{{loggedUserData.fullName|getInitials}}</div>
				<div class="profile-copy">
					<strong>{{loggedUserData.fullName}}</strong>
					<span>{{loggedUserData.roleName}}</span>
				</div>
				<button class="profile-menu" type="button" aria-label="Open profile menu">
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path d="m7 10 5 5 5-5" />
					</svg>
				</button>
			</div>
			<button class="logout-button" type="button" (click)="onLogout()">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-6" />
				</svg>
				<span>Log out</span>
			</button>
		</div>
	</aside>

	<main class="layout-content">
		<header class="topbar">
			<div class="container-fluid px-0">
				<div class="row align-items-center g-3">
					<div class="col-12 col-xl-4">
						<div class="page-context text-nowrap">
							<p class="topbar-eyebrow mb-1">Hospital workspace</p>
							<h1 class="topbar-title mb-0">Good morning, {{loggedUserData.fullName}}</h1>
						</div>
					</div>

					<div class="col-12 col-xl-5">
						<div class="input-group topbar-search shadow-sm">
							<span class="input-group-text" aria-hidden="true">
								<svg viewBox="0 0 24 24">
									<circle cx="11" cy="11" r="6.5"></circle>
									<path d="m16 16 4.5 4.5"></path>
								</svg>
							</span>
							<input class="form-control" [(ngModel)]="searchValue" type="search" placeholder="Search patients, staff, medicines..." aria-label="Search hospital workspace" />
							<button (click)="onSearch()" class="btn btn-primary search-button" type="button">Search</button>
						</div>
					</div>

					<div class="col-12 col-xl-3">
						<div class="topbar-actions d-flex align-items-center justify-content-xl-end gap-2">
							<button class="topbar-icon-button" type="button" aria-label="Help and support">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<circle cx="12" cy="12" r="9"></circle>
									<path d="M9.7 9a2.4 2.4 0 1 1 4.1 1.7c-1 .9-1.8 1.2-1.8 2.8M12 17h.01"></path>
								</svg>
							</button>
							<button class="topbar-icon-button notification-button" type="button" aria-label="View notifications">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path>
								</svg>
								<span class="notification-dot"></span>
							</button>
							<div class="topbar-user d-flex align-items-center gap-2 ms-xl-2 text-nowrap">
								<div class="topbar-avatar">{{loggedUserData.fullName|getInitials}}</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</header>

		<div class="layout-page-content container-fluid">
			<div class="row">
				<div class="col-12 px-0">
					<router-outlet></router-outlet>
				</div>
			</div>
		</div>
	</main>
</div>
